[project]
name = "common-park-crawler-platform"
version = "0.1.0"
description = "No-database configurable crawler platform"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.100", "uvicorn>=0.20"]
playwright = ["playwright>=1.40"]
dev = ["pytest>=7.0"]

[project.scripts]
crawler-platform = "crawler_platform.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

